# gatedgcnplus_ogbg-molhiv: paper settings from Table 13 (arXiv 2502.09263v3); readings from
# results/param_count_matching.md (all six reported counts matched, repo unopened).
dataset: ogbg-molhiv
arch: gnnplus
expected_params: 1076633
model:
  conv: gatedgcn
  layers: 3
  hidden: 256
  edge: true
  dropout: 0.0
  residual: true
  ffn: false
  pe_steps: 20
  pooling: mean
  pe_dim: 16
  head: halving
  head_layers: 3
train:
  batch_size: 32
  lr: 0.0001
  weight_decay: 1.0e-5
  epochs: 100
  warmup_epochs: 5
  scheduler: cosine_with_warmup   # A3 blind default
  clip_grad_norm: 0.0              # A14 blind default: off
  seed: 0
