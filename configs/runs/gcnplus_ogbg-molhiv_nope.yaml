# gcnplus_ogbg-molhiv without RWSE (C5, Table 6 "(-) PE"); otherwise identical.
# results/param_count_matching.md (all six reported counts matched, repo unopened).
dataset: ogbg-molhiv
arch: gnnplus
model:
  conv: gcn
  layers: 4
  hidden: 256
  edge: true
  dropout: 0.1
  residual: false
  ffn: true
  pe_steps: 0
  pooling: mean
  pe_dim: 16
  head: halving
  head_layers: 4
train:
  batch_size: 32
  lr: 0.0001
  weight_decay: 1.0e-5
  epochs: 100
  warmup_epochs: 5
  scheduler: cosine_with_warmup   # A3 blind default
  clip_grad_norm: 0.0              # A14 blind default: off
  seed: 0
