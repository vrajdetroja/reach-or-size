# Discrepancy measurement, DISCREPANCIES.md row 1: edge message as Eq. 6 is typeset (normalized, self-loops, no ReLU).
# One factor changed from configs/code/gcnplus_peptides-func.yaml: model {'gcn_message': 'paper'}, train -.
dataset: peptides-func
arch: gnnplus
expected_params: 507351
model:
  conv: gcn
  layers: 3
  hidden: 275
  edge: true
  dropout: 0.2
  residual: false
  ffn: false
  pe_steps: 32
  pooling: mean
  pe_dim: 28
  head: mlp
  head_layers: 4
  gcn_message: paper
  act: gelu
  head_dropout: true
train:
  batch_size: 16
  lr: 0.001
  weight_decay: 0.0
  epochs: 300
  warmup_epochs: 5
  scheduler: cosine_with_warmup
  clip_grad_norm: 1.0
  seed: 0
