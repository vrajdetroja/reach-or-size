# Extension arm B (PREREGISTRATION.md 5.3): 6 layers, residuals on, hidden 227 (params +0.4%), RWSE-32.
# Base: configs/code/gcnplus_peptides-func.yaml (code-aligned; deviation logged 2026-10-19); only the fields below differ from it.
# Changed: model {'residual': True, 'layers': 6, 'hidden': 227}, train -. Reused cells: none: residuals change the tuned config.
# expected_params is our implementation's count, not a paper number.
dataset: peptides-func
arch: gnnplus
expected_params: 509373
model:
  conv: gcn
  layers: 6
  hidden: 227
  edge: true
  dropout: 0.2
  residual: true
  ffn: false
  pe_steps: 32
  pooling: mean
  pe_dim: 28
  head: mlp
  head_layers: 4
  gcn_message: code
  act: gelu
  head_dropout: true
train:
  batch_size: 16
  lr: 0.001
  weight_decay: 0.0
  epochs: 300
  warmup_epochs: 5
  scheduler: cosine_with_warmup
  clip_grad_norm: 1.0
  seed: 0
