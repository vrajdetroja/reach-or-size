# Extension arm A (PREREGISTRATION.md 5.3): 25% training subset, RWSE-32.
# Base: configs/runs/gcnplus_peptides-func.yaml; only the fields below differ from it.
# Changed: model -, train {'subset_file': 'configs/subsets/peptides-func_train_frac25_seed0.json', 'steps_per_epoch': 680}. Reused cells: armA 100% cells = configs/runs/gcnplus_peptides-func.yaml (C1) and _nope.yaml (C5a).
# expected_params is our implementation's count, not a paper number.
dataset: peptides-func
arch: gnnplus
expected_params: 507351
model:
  conv: gcn
  layers: 3
  hidden: 275
  edge: true
  dropout: 0.2
  residual: false
  ffn: false
  pe_steps: 32
  pooling: mean
  pe_dim: 28
  head: mlp
  head_layers: 4
train:
  batch_size: 16
  lr: 0.001
  weight_decay: 0.0
  epochs: 300
  warmup_epochs: 5
  scheduler: cosine_with_warmup
  clip_grad_norm: 0.0
  seed: 0
  subset_file: configs/subsets/peptides-func_train_frac25_seed0.json
  steps_per_epoch: 680
